name: oleena
description: "Oleena Wedding Planner - Sri Lanka's premier wedding vendor discovery platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.6.0
  go_router: ^18.0.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
