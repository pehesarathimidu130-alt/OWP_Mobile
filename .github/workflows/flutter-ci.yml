name: Oleena Mobile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.x'
        cache: true

    - name: Get Dependencies
      run: flutter pub get

    - name: Analyze Project Code
      run: flutter analyze --no-fatal-infos --no-fatal-warnings

    - name: Run Widget / Unit Tests
      run: |
        if [ -d "test" ] && [ "$(ls -A test)" ]; then
          flutter test
        else
          echo "No standalone tests found; analysis passed."
        fi
